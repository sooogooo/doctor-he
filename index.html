        --color-text-secondary: 169 169 177; /* #A9A9B1 */
        --color-primary: 167 196 188; /* #A7C4BC */
        --color-secondary: 209 196 233; /* #D1C4E9 */
        --color-accent: 249 168 142; /* #F9A88E */
        --color-border: 68 68 70; /* #444446 */
        --color-warning: 229 115 115; /* #E57373 */
      }

      html.font-size-small { font-size: 14px; }

      .markdown-content h1, .markdown-content h2, .markdown-content h3 {
          margin-top: 1.25em;
          margin-bottom: 0.5em;
          font-weight: 600;
          line-height: 1.3;
      }

      .markdown-content h2 { font-size: 1.25em; }
      .markdown-content h3 { font-size: 1.1em; }
      .markdown-content p {
          margin-bottom: 1em;

      }

      .markdown-content ul { list-style-type: disc; }
      .markdown-content ol { list-style-type: decimal; }
      .markdown-content li { margin-bottom: 0.5em; }
      .markdown-content blockquote {
          border-left: 4px solid rgb(var(--color-border));
          padding-left: 1em;
          margin-left: 0;
          margin-bottom: 1em;
          font-style: italic;
          color: rgb(var(--color-text-secondary));
      }
      .markdown-content code {
          background-color: rgba(var(--color-primary), 0.1);
          color: rgb(var(--color-text-primary));
          padding: 0.2em 0.4em;
          border-radius: 4px;
          font-family: monospace;
      }
      .markdown-content pre {
          background-color: rgba(var(--color-text-primary), 0.05);
          padding: 1em;

          overflow-x: auto;
          margin-bottom: 1em;
      }
      .markdown-content pre code {
          background-color: transparent;
          color: inherit;
          padding: 0;
      }
      .markdown-content a {
          color: rgb(var(--color-accent));
          text-decoration: underline;
      }
      .markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1em;
      }
      .markdown-content th, .markdown-content td {
        border: 1px solid rgb(var(--color-border));

      }
      .markdown-content th {
        font-weight: 600;
        background-color: rgba(var(--color-text-primary), 0.05);
      }

    <script>
      function withOpacity(variableName) {
        return ({ opacityValue }) => {
          if (opacityValue !== undefined) {
            return `rgba(var(${variableName}), ${opacityValue})`;
          }
          return `rgb(var(${variableName}))`;
        };
      }
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Noto Sans SC"', 'sans-serif'],
            },
            colors: {
              background: withOpacity('--color-background'),
              surface: withOpacity('--color-surface'),
              'text-primary': withOpacity('--color-text-primary'),
              'text-secondary': withOpacity('--color-text-secondary'),
              primary: withOpacity('--color-primary'),
              secondary: withOpacity('--color-secondary'),
              accent: withOpacity('--color-accent'),
              border: withOpacity('--color-border'),
              warning: withOpacity('--color-warning'),
            },
            letterSpacing: {
              'wide': '0.025em',
              'wider': '0.05em',
            },
            lineHeight: {
              'relaxed': '1.75',
              'loose': '2',
            },
            boxShadow: {
              'soft': '0 4px 12px 0 rgba(var(--color-text-primary), 0.05)',
              'soft-dark': '0 4px 14px 0 rgba(0, 0, 0, 0.15)',
            }
          },
        },
      };
    </script>
